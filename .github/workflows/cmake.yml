name: Build / Test

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
#          - os: ubuntu-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-11-arm

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Configure & Build
      uses: threeal/cmake-action@v2.1.0
      with:
        build-dir: _build
        build-args: --config ${{env.BUILD_TYPE}} --parallel 6
        options: |
          CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          CMAKE_PROJECT_TOP_LEVEL_INCLUDES=build.props/conan_provider.cmake

    - name: Test
      working-directory: _build
      run: ctest -C ${{env.BUILD_TYPE}} -VV
